<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cetak Label Part (QR Code)</title>
    
    <!-- Pustaka Eksternal -->
    <script src="https://cdn.sheetjs.com/xlsx-0.19.3/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Standar Enterprise -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#1f2937',    
                            red: '#dc2626',     
                            bg: '#e5e7eb',      
                            green: '#047857',   
                            blue: '#2563eb',    
                            yellow: '#eab308'   
                        },
                        ink: '#000000',
                        muted: '#000000'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['Roboto Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
    
    <style>
        :root {
            --page-width: 297mm;
            --page-height: 210mm;
            --margin-x: 5mm;
            --margin-y: 5mm;
            --qr-size: 12mm; 
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #e5e7eb; 
            min-height: 100vh;
            color: #000000;
            position: relative;
            overflow-x: hidden;
        }
        
        /* KERTAS A4 PREVIEW */
        .a4-paper {
            width: var(--page-width);
            height: var(--page-height);
            max-width: 100%;
            aspect-ratio: 297 / 210;
            background: #ffffff;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            margin: 20px 0;
            padding: var(--margin-y) var(--margin-x);
            position: relative;
            border-radius: 2px;
            overflow: hidden;
            border: 1px solid #000000;
        }
        
        /* Garis merah tebal di atas kertas */
        .a4-paper::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 5px;
            background: #dc2626; 
        }
        
        .labels-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(12, 1fr);
            gap: 1.2mm 2mm;
            height: 100%;
        }

        /* BORDER TABEL HITAM PEKAT */
        .label-card {
            border: 2px solid #000000; 
            border-radius: 0;
            width: 100%;
            height: 100%;
            position: relative;
            background: #ffffff;
            transition: all 0.1s ease;
            display: flex; align-items: center;
            overflow: hidden;
        }
        
        .label-card:hover {
            background: #f9fafb;
            border-color: #000000; 
        }

        .label-content { display: flex; width: 100%; height: 100%; align-items: center; padding: 1mm; }
        
        .qr-section {
            width: var(--qr-size);
            height: var(--qr-size);
            flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            background: #fff; 
            border: 1.5px solid #000000; 
            padding: 0.5mm;
        }
        
        .qr-section img { width: 100%; height: 100%; object-fit: contain; }

        /* GARIS PEMISAH TENGAH HITAM PEKAT */
        .text-section {
            flex-grow: 1; padding: 0 2mm;
            display: flex; flex-direction: column; justify-content: center;
            border-left: 2px solid #000000; 
            margin-left: 1.5mm; height: 100%;
            overflow: hidden; white-space: nowrap;
        }
        
        /* TEKS HITAM PEKAT */
        .part-text {
            font-family: 'Roboto Mono', monospace;
            font-weight: 700;
            font-size: 11px;
            color: #000000;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            line-height: 1.1;
        }
        .desc-text {
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            font-size: 6.5px;
            color: #000000;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            margin-top: 2px;
            line-height: 1.1;
        }
        
        /* UPLOAD ZONE */
        .upload-zone {
            position: relative; overflow: hidden;
            background: #ffffff;
            border: 2px dashed #9ca3af;
            transition: all 0.2s ease;
        }
        
        .upload-zone:hover, .upload-zone.dragover { 
            border-color: #eab308; 
            background: #fefce8; 
        }

        /* ANIMASI */
        .toast { animation: toastSlide 0.3s ease; }
        @keyframes toastSlide { from { transform: translateX(120%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        
        .label-card { opacity: 0; animation: labelFade 0.2s ease forwards; }
        @keyframes labelFade { from { opacity: 0; } to { opacity: 1; } }
        
        /* PRINT SETTINGS */
        @media print {
            body { background: white; }
            .no-print { display: none !important; }
            .a4-paper { box-shadow: none; margin: 0; padding: var(--margin-y) var(--margin-x); width: 297mm; height: 210mm; border: none; border-radius: 0; }
            .a4-paper::before { display: none; }
        }
        
        @media (max-width: 900px) {
            .a4-paper { transform: scale(0.55); transform-origin: top center; margin-bottom: -450px; }
        }
    </style>
</head>
<body class="flex flex-col items-center p-4 md:p-8 relative">
    
    <!-- HEADER GELAP -->
    <header class="no-print w-full max-w-5xl mb-6 relative z-10">
        <div class="bg-brand-dark rounded-t-md px-4 py-3 flex flex-col md:flex-row justify-between items-center gap-4 border-b-4 border-brand-red">
            <div class="flex items-center gap-4">
                <div class="text-white flex items-center gap-2">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                    </svg>
                    <span class="font-bold text-xl tracking-wider text-white">DISTRICK <span class="text-brand-red">KUPANG</span></span>
                </div>
            </div>
            
            <div class="flex items-center gap-3">
                <span class="text-sm font-semibold text-brand-red">POLYTRON</span>
                <div class="w-8 h-8 rounded-full bg-gray-700 flex items-center justify-center border border-gray-500">
                    <svg class="w-5 h-5 text-gray-300" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd" /></svg>
                </div>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="w-full max-w-5xl flex flex-col items-center">
        
        <!-- CONTROL SECTION -->
        <section class="no-print w-full mb-6 relative z-10">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-end mb-4">
                <div>
                    <h2 class="text-2xl font-bold text-gray-800">Cetak Label Sparepart</h2>
                    <p class="text-sm text-gray-500 mt-1">Upload data untuk menghasilkan label QR Code</p>
                </div>
            </div>

            <div class="bg-white rounded shadow-sm border border-gray-300 p-6 flex flex-col md:flex-row gap-6">
                
                <div class="upload-zone flex-1 p-8 text-center cursor-pointer" id="upload-zone">
                    <input type="file" id="file-input-1" accept=".xlsx, .xls" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
                    <div class="pointer-events-none relative z-1">
                        <svg class="w-10 h-10 mx-auto mb-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
                        </svg>
                        <strong class="block text-base font-bold text-gray-700">Upload File Excel</strong>
                        <p class="text-xs text-gray-500 mt-1">Format kolom: Part, Deskripsi, Qty</p>
                    </div>
                </div>
                
                <div class="flex flex-col justify-center min-w-[200px] border-t md:border-t-0 md:border-l border-gray-200 pt-6 md:pt-0 md:pl-6">
                    <div class="mb-4 text-center md:text-left">
                        <span class="text-xs font-bold text-gray-500 uppercase tracking-wider">Total Label</span>
                        <div class="flex items-baseline justify-center md:justify-start gap-1 mt-1">
                            <span id="label-count-1" class="text-3xl font-bold text-gray-800">0</span>
                            <span class="text-sm font-medium text-gray-500">Data</span>
                        </div>
                    </div>
                    
                    <div class="flex flex-col gap-2">
                        <button id="btn-clear-1" class="hidden w-full px-4 py-2 bg-white border border-gray-300 text-gray-700 rounded shadow-sm font-semibold text-sm hover:bg-gray-50 transition-all" onclick="clearData()">
                            Reset Data
                        </button>
                        <button id="btn-download-1" disabled class="w-full px-4 py-2.5 bg-brand-green text-white rounded shadow-sm font-semibold text-sm hover:bg-green-800 transition-all disabled:opacity-50 disabled:cursor-not-allowed" onclick="generatePDF()">
                            Download PDF
                        </button>
                    </div>
                </div>
            </div>
        </section>
        
        <!-- PREVIEW AREA -->
        <div class="relative z-10 w-full flex justify-center overflow-auto pb-12">
            <div class="a4-paper">
                <div class="labels-container" id="labels-container-1">
                    <div class="col-span-full row-span-full flex flex-col items-center justify-center h-full text-gray-400 bg-gray-50 border-2 border-dashed border-gray-200">
                        <svg class="w-12 h-12 mb-3 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                        </svg>
                        <p class="font-semibold text-gray-500">Belum ada data</p>
                        <p class="text-xs text-gray-400 mt-1">Silakan upload file Excel untuk melihat pratinjau.</p>
                    </div>
                </div>
            </div>
        </div>
    </main>
    
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2"></div>

<script>
    // === STATE ===
    let labelsToPrint = [];
    
    // === PDF CONFIG ===
    const PDF_CFG = {
        orientation: 'l', unit: 'mm', format: 'a4',
        pageWidth: 297, pageHeight: 210,
        marginX: 5, marginY: 5,
        cols: 4, rows: 12,
        gapX: 2, gapY: 1.2,
        qrSize: 12, fontSizePart: 9, fontSizeDesc: 5.5
    };
    
    // === FILE HANDLING ===
    document.getElementById('file-input-1').addEventListener('change', (e) => {
        if (e.target.files.length) handleFile(e.target.files[0]);
    });
    
    const uploadZone = document.getElementById('upload-zone');
    uploadZone.addEventListener('dragover', (e) => { e.preventDefault(); uploadZone.classList.add('dragover'); });
    uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
    uploadZone.addEventListener('drop', (e) => {
        e.preventDefault(); uploadZone.classList.remove('dragover');
        if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
    });

    function handleFile(file) {
        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                const workbook = XLSX.read(e.target.result, { type: 'array' });
                const sheet = workbook.Sheets[workbook.SheetNames[0]];
                const json = XLSX.utils.sheet_to_json(sheet, { defval: "" });
                if (json.length === 0) throw new Error("File kosong");
                processData(json);
                showToast(`Berhasil memuat ${json.length} baris data`, 'success');
            } catch (err) {
                showToast('Gagal membaca file: ' + err.message, 'error');
            }
        };
        reader.readAsArrayBuffer(file);
    }
    
    function processData(json) {
        const data = json.map((row, idx) => {
            const findKey = (keys) => {
                const k = Object.keys(row).find(key => keys.includes(key.toLowerCase().trim()));
                return k ? row[k] : "";
            };
            return {
                id: idx,
                part: findKey(['part', 'part number', 'kode', 'code', 'id', 'pn']) || 'N/A',
                desc: findKey(['deskripsi', 'description', 'desc', 'nama', 'name']) || '-',
                qty: findKey(['qty', 'quantity', 'jumlah', 'stock']) || '1'
            };
        });
        
        const labels = [];
        data.forEach(item => {
            let q = parseInt(item.qty);
            if (isNaN(q) || q < 1) q = 1;
            for (let i = 0; i < q; i++) labels.push({ ...item });
        });
        
        labelsToPrint = labels;
        renderLabels();
    }
    
    function clearData() {
        labelsToPrint = [];
        document.getElementById('file-input-1').value = '';
        renderLabels();
        showToast('Data berhasil direset', 'info');
    }
    
    // === RENDER LABELS ===
    function renderLabels() {
        const container = document.getElementById('labels-container-1');
        const countBadge = document.getElementById('label-count-1');
        const btnClear = document.getElementById('btn-clear-1');
        const btnDownload = document.getElementById('btn-download-1');
        
        if (labelsToPrint.length === 0) {
            container.innerHTML = `
                <div class="col-span-full row-span-full flex flex-col items-center justify-center h-full text-gray-400 bg-gray-50 border-2 border-dashed border-gray-200">
                    <svg class="w-12 h-12 mb-3 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                    </svg>
                    <p class="font-semibold text-gray-500">Belum ada data</p>
                    <p class="text-xs text-gray-400 mt-1">Silakan upload file Excel untuk melihat pratinjau.</p>
                </div>`;
            btnDownload.disabled = true;
            btnClear.classList.add('hidden');
            countBadge.textContent = '0';
            return;
        }
        
        btnDownload.disabled = false;
        btnClear.classList.remove('hidden');
        countBadge.textContent = labelsToPrint.length;
        
        container.innerHTML = '';
        
        const displayLimit = 48; 
        const dataToRender = labelsToPrint.slice(0, displayLimit);
        
        dataToRender.forEach((item, index) => {
            const el = document.createElement('div');
            el.className = 'label-card';
            el.style.animationDelay = `${index * 10}ms`;
            el.innerHTML = `
                <div class="label-content">
                    <div class="qr-section"><img src="${generateQRDataURL(item.part, 3)}" alt="QR"></div>
                    <div class="text-section">
                        <div class="part-text">${escapeHtml(item.part)}</div>
                        <div class="desc-text">${escapeHtml(item.desc)}</div>
                    </div>
                </div>`;
            container.appendChild(el);
        });
        
        if (labelsToPrint.length > displayLimit) {
            showToast(`Menampilkan 48 dari ${labelsToPrint.length} label. Unduh PDF untuk semua.`, 'info');
        }
    }
    
    // === GENERATE PDF ===
    function generatePDF() {
        if (!labelsToPrint.length) return;
        showToast('Sedang membuat PDF...', 'info');
        
        setTimeout(() => {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ 
                orientation: PDF_CFG.orientation, unit: PDF_CFG.unit, format: PDF_CFG.format 
            });
            
            const cfg = PDF_CFG;
            const usableW = cfg.pageWidth - (2 * cfg.marginX);
            const usableH = cfg.pageHeight - (2 * cfg.marginY);
            const labelW = (usableW - ((cfg.cols - 1) * cfg.gapX)) / cfg.cols;
            const labelH = (usableH - ((cfg.rows - 1) * cfg.gapY)) / cfg.rows;
            
            let colIdx = 0;
            let rowIdx = 0;

            labelsToPrint.forEach((item) => {
                if (rowIdx >= cfg.rows) {
                    doc.addPage();
                    rowIdx = 0;
                    colIdx = 0;
                }
                
                const x = cfg.marginX + (colIdx * (labelW + cfg.gapX));
                const y = cfg.marginY + (rowIdx * (labelH + cfg.gapY));
                
                // === BORDER TABEL HITAM PEKAT ===
                doc.setDrawColor(0, 0, 0); 
                doc.setLineWidth(0.3);
                doc.rect(x, y, labelW, labelH);
                
                // === QR CODE HITAM PEKAT ===
                const qr = qrcode(0, 'L');
                qr.addData(item.part);
                qr.make();
                
                const moduleCount = qr.getModuleCount();
                const cellSize = cfg.qrSize / moduleCount;
                const qrX = x + 1.5;
                const qrY = y + (labelH - cfg.qrSize) / 2;
                
                doc.setFillColor(0, 0, 0); // hitam pekat
                for (let r = 0; r < moduleCount; r++) {
                    for (let c = 0; c < moduleCount; c++) {
                        if (qr.isDark(r, c)) {
                            doc.rect(qrX + c * cellSize, qrY + r * cellSize, cellSize, cellSize, 'F');
                        }
                    }
                }
                
                // === GARIS PEMISAH TENGAH HITAM PEKAT ===
                doc.setDrawColor(0, 0, 0);
                doc.setLineWidth(0.2);
                doc.line(x + cfg.qrSize + 2.5, y + 1, x + cfg.qrSize + 2.5, y + labelH - 1);
                
                // === TEKS PART HITAM PEKAT ===
                doc.setFont('helvetica', 'bold');
                doc.setFontSize(cfg.fontSizePart); 
                doc.setTextColor(0, 0, 0);
                doc.text(item.part, x + cfg.qrSize + 4, y + labelH/2 - 0.5);
                
                // === TEKS DESKRIPSI HITAM PEKAT ===
                doc.setFont('helvetica', 'normal');
                doc.setFontSize(cfg.fontSizeDesc); 
                doc.setTextColor(0, 0, 0);
                doc.text(item.desc.substring(0, 50), x + cfg.qrSize + 4, y + labelH/2 + 2);
                
                colIdx++;
                if (colIdx >= cfg.cols) {
                    colIdx = 0;
                    rowIdx++;
                }
            });
            
            doc.save(`Label_QR_Sparepart_${new Date().toISOString().slice(0, 10)}.pdf`);
            showToast('PDF berhasil diunduh!', 'success');
        }, 150);
    }
    
    // === UTILITIES ===
    function generateQRDataURL(text, size) {
        const qr = qrcode(0, 'L');
        qr.addData(text);
        qr.make();
        return qr.createDataURL(size, 0);
    }
    
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = String(text);
        return div.innerHTML;
    }
    
    function showToast(msg, type = 'info') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        const styles = { 
            success: 'bg-brand-green', 
            error: 'bg-brand-red', 
            info: 'bg-gray-700' 
        };
        
        toast.className = `toast ${styles[type]} text-white px-5 py-3 rounded shadow-md text-sm flex items-center gap-3 font-medium`;
        toast.innerHTML = `<span>${msg}</span>`;
        container.appendChild(toast);
        
        setTimeout(() => { 
            toast.style.opacity = '0'; 
            setTimeout(() => toast.remove(), 300); 
        }, 3000);
    }
</script>

</body>
</html>
